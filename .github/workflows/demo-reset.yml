name: Demo Reset & Seed (Every 2 Hours)

on:
  schedule:
    # Runs at minute 0 every 2 hours (00:00, 02:00, 04:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-demo:
    # Only run on the upstream demo repository if Cloudflare token is provided
    if: github.repository == 'opensourcesolutioncafe/Burrow' || github.repository == 'Open-Source-Solution-Cafe/Burrow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset and Seed Remote Demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          DEMO_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEMO_CLOUDFLARE_ACCOUNT_ID || secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
          DEMO_WORKER_NAME: ${{ vars.DEMO_WORKER_NAME || 'burrow-demo' }}
          DEMO_D1_DATABASE_NAME: ${{ vars.DEMO_D1_DATABASE_NAME || 'burrow-demo' }}
          DEMO_D1_DATABASE_ID: ${{ secrets.DEMO_D1_DATABASE_ID || vars.DEMO_D1_DATABASE_ID }}
          DEMO_R2_BUCKET_NAME: ${{ vars.DEMO_R2_BUCKET_NAME || 'burrow-demo-files' }}
          DEMO_CLOUDFLARE_DOMAIN: ${{ vars.DEMO_CLOUDFLARE_DOMAIN }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL || 'demo@osscafe.com' }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || 'demopassword123' }}
          BURROW_ALLOW_DEMO_RESET: 'true'
        run: |
          node scripts/demo-reset.mjs --remote --demo --confirm-demo-reset=RESET-DEMO-BURROW
