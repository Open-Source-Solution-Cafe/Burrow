name: Demo Reset & Seed (Every 2 Hours)

on:
  schedule:
    # Runs at minute 0 every 2 hours (00:00, 02:00, 04:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-demo:
    # Only run on the upstream demo repository if Cloudflare token is provided
    if: github.repository == 'opensourcesolutioncafe/Burrow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset and Seed Remote Demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL || 'demo@osscafe.com' }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || 'demopassword123' }}
        run: |
          node scripts/demo-reset.mjs --remote --force
