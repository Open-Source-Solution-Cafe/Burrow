name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Architecture & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: burrow_test_password
          POSTGRES_DB: burrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U burrow -d burrow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundles
        run: pnpm run build

      - name: Verify architecture, decoupling, sync, and dependency licenses
        run: |
          node scripts/check-sync.mjs
          node scripts/check-basalt.mjs
          node scripts/check-decoupling.mjs
          node scripts/check-licenses.mjs

      - name: Typecheck and zero-warning lint
        run: |
          pnpm exec tsc -b
          pnpm exec eslint --max-warnings=0 .

      - name: Run SQLite, PostgreSQL 17, Unit, and Worker tests
        env:
          BURROW_TEST_POSTGRES_URL: postgres://burrow:burrow_test_password@127.0.0.1:5432/burrow_test
        run: pnpm exec vitest run
