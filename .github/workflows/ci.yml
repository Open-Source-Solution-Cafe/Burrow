name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Architecture & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public/private decoupling
        run: node scripts/check-decoupling.mjs

      - name: Verify dependency licenses
        run: node scripts/check-licenses.mjs

      - name: Run typecheck, lint, unit and SQLite tests
        run: pnpm run check:sqlite

      - name: Run Cloudflare Workers integration tests
        run: pnpm exec vitest run --project worker
