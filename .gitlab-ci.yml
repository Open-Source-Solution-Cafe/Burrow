# Automated one-click upstream sync for GitLab + Cloudflare Workers Builds.
# Runs ONLY when triggered by Burrow's "Upgrade Now" button (Pipeline Trigger)
# or manually from the GitLab UI — normal pushes never invoke this job.
#
# One-time setup in GitLab -> Settings -> CI/CD:
#   1. Create a Project Access Token (role: Maintainer, scope: write_repository)
#      and save it as CI/CD Variable: BURROW_SYNC_TOKEN (Masked & Protected).
#   2. Create a Pipeline Trigger Token and copy the trigger URL into your
#      Cloudflare Worker Secrets as SELF_UPDATE_WEBHOOK_URL:
#      https://gitlab.com/api/v4/projects/<PROJECT_ID>/trigger/pipeline?token=<TRIGGER_TOKEN>&ref=main

stages:
  - sync

sync_upstream_burrow:
  stage: sync
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git
    - git config user.name "Burrow Updater"
    - git config user.email "burrow-updater@users.noreply.gitlab.com"
  script:
    - |
      if [ -z "$BURROW_SYNC_TOKEN" ]; then
        echo "Error: BURROW_SYNC_TOKEN CI/CD variable is not set."
        echo "Create a Project Access Token with write_repository scope and add it as BURROW_SYNC_TOKEN."
        exit 1
      fi
    - git checkout -B "$CI_COMMIT_REF_NAME" "origin/$CI_COMMIT_REF_NAME"
    - node scripts/sync-upstream.mjs
    - git -c core.hooksPath=/dev/null push "https://oauth2:${BURROW_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
