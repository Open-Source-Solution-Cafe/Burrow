services:
  burrow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-3005}:3005'
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgres://burrow:burrowpassword@postgres:5432/burrow
      # Local quick-start evaluation mode (auto-generates ephemeral credentials if left unset on localhost).
      # For internet-accessible production, set BETTER_AUTH_URL=https://notes.example.com,
      # generate unique BETTER_AUTH_SECRET & BOOTSTRAP_TOKEN in .env, and set ALLOW_LOCAL_DOCKER_EVAL=false.
      - ALLOW_LOCAL_DOCKER_EVAL=${ALLOW_LOCAL_DOCKER_EVAL:-true}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3005}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      # Persistent local storage for project files and attachments
      - LOCAL_STORAGE_PATH=/app/data/uploads
      # Automatically run migrations on container start
      - DATABASE_MIGRATE=true
    volumes:
      - burrow_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=burrow
      - POSTGRES_PASSWORD=burrowpassword
      - POSTGRES_DB=burrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U burrow -d burrow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  burrow_uploads:
