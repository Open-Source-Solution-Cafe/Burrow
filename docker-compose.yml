services:
  burrow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-3005}:3005'
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgres://burrow:burrowpassword@postgres:5432/burrow
      # Set to your publicly accessible domain or IP in production (e.g. https://notes.example.com)
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://burrow.local:3005}
      # Generate a secure 32+ character random string for production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-burrow-selfhost-secret-key-32-bytes-minimum!!}
      # Initial setup bootstrap token (16+ chars) to create your first owner workspace account
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-burrow-bootstrap-token-initial-setup}
      # Persistent local storage for project files and attachments
      - LOCAL_STORAGE_PATH=/app/data/uploads
      # Automatically run migrations on container start
      - DATABASE_MIGRATE=true
    volumes:
      - burrow_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=burrow
      - POSTGRES_PASSWORD=burrowpassword
      - POSTGRES_DB=burrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U burrow -d burrow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  burrow_uploads:
